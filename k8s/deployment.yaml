apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-fastapi
  namespace: default
  labels:
    app: project-fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-fastapi
  template:
    metadata:
      labels:
        app: project-fastapi
    spec:
      containers:
      - name: fast-container
        image: ajilash25/project-fastapi:5
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
